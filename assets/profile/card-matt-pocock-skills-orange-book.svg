<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Matt Pocock Skills Orange Book</title>
  <desc id="desc">A warm project card showing an open orange book with skill tiles for AI pair-programming beginners.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#3F2414" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect x="8" y="8" width="1264" height="304" rx="30" fill="#FEF9EB" stroke="#EAD9C8" stroke-width="2"/>
  <rect x="8" y="8" width="1264" height="304" rx="30" fill="url(#grid)"/>
  <rect x="54" y="42" width="188" height="34" rx="17" fill="#3F2414"/>
  <text x="148" y="64" fill="#FEF9EB" font-family="Inter, sans-serif" font-size="13" font-weight="900" letter-spacing="1.8" text-anchor="middle">SKILLS GUIDE · 导读</text>
  <text x="54" y="133" fill="#3F2414" font-family="Inter, sans-serif" font-size="44" font-weight="900">Matt Pocock Skills 橙皮书</text>
  <text x="54" y="174" fill="#FA9439" font-family="Inter, sans-serif" font-size="25" font-weight="800">37 skills, explained in Chinese.</text>
  <text x="54" y="218" fill="#3F2414" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="600">新手友好 · 匿名 UI 客户端实例 · Excalidraw 与阿舟图解</text>
  <rect x="54" y="250" width="236" height="38" rx="19" fill="#FA9439"/>
  <text x="172" y="275" fill="#3F2414" font-family="Inter, sans-serif" font-size="14" font-weight="900" letter-spacing="1.3" text-anchor="middle">OPEN THE REPOSITORY →</text>

  <g transform="translate(748 52)">
    <!-- open book -->
    <path d="M230 24 C180 4 120 4 70 24 V196 C120 176 180 176 230 196 C280 176 340 176 390 196 V24 C340 4 280 4 230 24 Z" fill="#FFFFFF" stroke="#3F2414" stroke-width="3"/>
    <path d="M230 24 V196" stroke="#3F2414" stroke-width="3"/>
    <g stroke="#FAA67C" stroke-width="6" stroke-linecap="round">
      <path d="M96 52 H204"/><path d="M96 78 H204"/><path d="M96 104 H180"/>
    </g>
    <g stroke="#FA9439" stroke-width="6" stroke-linecap="round">
      <path d="M256 52 H364"/><path d="M256 78 H364"/><path d="M256 104 H340"/>
    </g>
    <!-- skill tiles -->
    <g font-family="Inter, sans-serif" font-size="12" font-weight="900" letter-spacing="1" text-anchor="middle">
      <rect x="86" y="132" width="90" height="34" rx="10" fill="#3F2414"/>
      <text x="131" y="154" fill="#FEF9EB">TRIGGER</text>
      <rect x="186" y="132" width="90" height="34" rx="10" fill="#FA9439"/>
      <text x="231" y="154" fill="#3F2414">GATE</text>
      <rect x="286" y="132" width="90" height="34" rx="10" fill="#F6E5D4" stroke="#3F2414" stroke-width="2"/>
      <text x="331" y="154" fill="#3F2414">SKILL</text>
    </g>
    <circle cx="414" cy="38" r="26" fill="#FA9439"/>
    <text x="414" y="34" fill="#3F2414" font-family="Inter, sans-serif" font-size="16" font-weight="900" text-anchor="middle">37</text>
    <text x="414" y="50" fill="#3F2414" font-family="Inter, sans-serif" font-size="10" font-weight="900" text-anchor="middle">SKILLS</text>
  </g>
</svg>
