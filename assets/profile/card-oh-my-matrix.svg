  <text x="54" y="174" fill="#FA9439" font-family="Inter, sans-serif" font-size="25" font-weight="800">Long-running work. Visible boundaries.</text>
  <text x="54" y="218" fill="#FEF9EB" font-family="'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="600">持续执行 · 并行工作流 · 权限守卫 · 证据回收 · WIP 诚实</text>
