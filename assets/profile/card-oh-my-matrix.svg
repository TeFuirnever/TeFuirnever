<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">oh-my-matrix</title>
  <desc id="desc">A dark warm project card with connected workflow nodes and permission gates.</desc>
  <defs>
