name: Generate contribution snake

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      # 贪吃蛇动画用阿舟配色，产物推到 output 分支，不往 main 产生提交。
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#FA9439&color_dots=#F8EEDC,#FAD3A8,#FAA67C,#FA9439,#3F2414
            dist/snake-dark.svg?palette=github-dark&color_snake=#FBF5EA&color_dots=#2A1D14,#5A3520,#8C522A,#FAA67C,#FA9439

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
