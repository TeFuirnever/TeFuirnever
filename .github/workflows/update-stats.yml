name: Update profile stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch public GitHub stats
        id: stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          result=$(gh api graphql -f query='
            query {
              user(login: "TeFuirnever") {
                repositories(
                  first: 100
                  ownerAffiliations: OWNER
                  isFork: false
                  privacy: PUBLIC
                  orderBy: {field: STARGAZERS, direction: DESC}
                ) {
                  totalCount
                  nodes { stargazerCount }
                }
                followers { totalCount }
              }
            }')

          stars=$(jq '[.data.user.repositories.nodes[].stargazerCount] | add // 0' <<<"$result")
          followers=$(jq -r '.data.user.followers.totalCount' <<<"$result")
          repos=$(jq -r '.data.user.repositories.totalCount' <<<"$result")

          format_count() {
            local value=$1
            if [ "$value" -ge 1000 ]; then
              awk -v value="$value" 'BEGIN { printf "%.1fk", value / 1000 }' | sed 's/\.0k$/k/'
            else
              printf '%s' "$value"
            fi
          }

          {
            echo "stars=$(format_count "$stars")"
            echo "followers=$(format_count "$followers")"
            echo "repos=$repos"
          } >> "$GITHUB_OUTPUT"

      - name: Update README badges
        env:
          STARS: ${{ steps.stats.outputs.stars }}
          FOLLOWERS: ${{ steps.stats.outputs.followers }}
          REPOS: ${{ steps.stats.outputs.repos }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("README.md")
          content = path.read_text(encoding="utf-8")
          replacement = "\n".join(
              [
                  "<!-- STATS-START -->",
                  f"[![Total Stars](https://img.shields.io/badge/Total%20Stars-{os.environ['STARS']}-FA9439?style=flat&logo=github&logoColor=white)](https://github.com/TeFuirnever)",
                  f"[![Followers](https://img.shields.io/badge/Followers-{os.environ['FOLLOWERS']}-3F2414?style=flat&logo=github&logoColor=white)](https://github.com/TeFuirnever?tab=followers)",
                  f"[![Original Repos](https://img.shields.io/badge/Original%20Repos-{os.environ['REPOS']}-FAA67C?style=flat&logo=github&logoColor=white)](https://github.com/TeFuirnever?tab=repositories)",
                  "<!-- STATS-END -->",
              ]
          )
          updated, count = re.subn(
              r"<!-- STATS-START -->.*?<!-- STATS-END -->",
              replacement,
              content,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f"expected one stats block, found {count}")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi
