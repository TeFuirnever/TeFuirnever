name: Update profile stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # fetch_stats.py → count_loc.py → render_profile.py 链路与本地一致，
      # 中间产物只落在 .profile-build/（gitignore），最终提交 README + 两张卡片。
      - name: Fetch public GitHub stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_stats.py

      - name: Count lines of code
        run: python3 scripts/count_loc.py

      - name: Render cards and badges
        run: python3 scripts/render_profile.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/profile/card-neofetch.svg assets/profile/card-contributions.svg
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi
